# ============================================================
# ruoyi-jdk25 CI/CD (GitHub Actions)
# monorepo 部署仓库：后端源码在仓库根(pom 在根)，前端源码在 frontend/
# 产物: 后端/前端 Docker 镜像，推送 GHCR (ghcr.io/<owner>/ruoyi-jdk25-*)
#
# 前置(私仓必须配):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   1. GHCR_TOKEN  (GitHub PAT, 勾选 write:packages)
# ============================================================
name: ruoyi-jdk25-build-push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}          # 手动触发

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ruoyi-jdk25-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ruoyi-jdk25-frontend

jobs:
  # ================= 后端 Docker 镜像 =================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write          # cache 读写
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================= 前端 Docker 镜像 =================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max