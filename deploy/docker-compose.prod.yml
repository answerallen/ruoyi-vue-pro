# ============================================================
# ruoyi-jdk25 生产机编排 (NanZi 生产机 8.138.163.232)
# 服务: mysql + backend + frontend
# Redis 复用宿主机已有 docker (nanzi-redis, 6379) —— 不起新 redis 容器
#
# 运行:
#   docker compose -f deploy/docker-compose.prod.yml up -d
# ============================================================
version: "3.9"

services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "ruoyi-vue-pro"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
      - --innodb_buffer_pool_size=128M     # 适配2G机器
    volumes:
      - mysql-data:/var/lib/mysql
      # 初始化脚本挂载（首次启动自动执行 sql/mysql/*.sql）
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 20s
      timeout: 5s
      retries: 10

  # ---------- 后端 (Spring Boot, 端口 48080) ----------
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/answerallen/ruoyi-jdk25-backend:latest}
    container_name: ruoyi-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      # MySQL 连接(指向 compose 内 mysql 服务)
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_DB: "ruoyi-vue-pro"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "123456"
      # Redis 连接(复用宿主机 nanzi-redis；用宿主内网IP直连, host-gateway在compose网络可能指错网段)
      REDIS_HOST: "172.18.29.129"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "nanzi_redis_2v9qX"
      # 关闭登录验证码(relaxed binding: YDAO_CAPTCHA_ENABLE -> yudao.captcha.enable), 免重建即可生效
      YDAO_CAPTCHA_ENABLE: "false"
      # JVM 限堆，适配 2G 生产机；-Dyudao.captcha.enable=false 关闭登录验证码(JVM系统属性对@Value有效)
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Dyudao.captcha.enable=false -Dyudao.tenant.enable=false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "48080:48080"
    deploy:
      resources:
        limits:
          memory: 900M

  # ---------- 前端 (nginx, 端口 8085) ----------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/answerallen/ruoyi-jdk25-frontend:latest}
    container_name: ruoyi-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8085:80"
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------- AgentScope (yudao 重写版) 独立后端 (容器内 48080, 宿主映射 48081) ----------
  agentscope:
    image: ${AGENTSCOPE_IMAGE:-ghcr.io/answerallen/agentscope-yudao-backend:latest}
    container_name: agentscope
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: "dev"
      # 独立数据库：避免与官方 ruoyi-vue-pro 库的 ai_* 表(官方 AI 模块)重名冲突 —— agentscope 各表冷藏在此库
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_DB: "agentscope"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "123456"
      # 复用同一 Redis(宿主内网直连, 与 backend 一致)
      REDIS_HOST: "172.18.29.129"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "nanzi_redis_2v9qX"
      # 关闭验证码/租户(与 ruoyi backend 一致)
      YDAO_CAPTCHA_ENABLE: "false"
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Dyudao.captcha.enable=false -Dyudao.tenant.enable=false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "48081:48080"
    deploy:
      resources:
        limits:
          memory: 900M

volumes:
  mysql-data:
    driver: local